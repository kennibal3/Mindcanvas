name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      # REQ-054 的一小片：gofmt 格式检查。
      # 此前「代码要 gofmt」只是口头约定，欠账从 25 个文件涨到 45 个都没人发现
      # （没有自动检查的约定等于不存在）。2026-09-20 全仓一次性 gofmt -w 清零后加入本检查，
      # 之后任何未格式化的 Go 文件都会让 PR 变红。本地修复：cd server && gofmt -w .
      - name: gofmt 格式检查
        run: |
          cd server
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt，请在 server/ 下运行 gofmt -w . 后重新提交："
            echo "$unformatted"
            exit 1
          fi

      - name: go build + vet
        run: |
          cd server
          go build ./...
          go vet ./...

      # REQ-054 的一小片：此前 CI 只编译不跑测试，而项目里已有 3 个测试文件
      # 约 26 个用例（handlers/diagram_validate_test.go 7 组脏数据、
      # services/diagram_survival_test.go 存活分档、
      # services/courseware_service_test.go 11 组 zip 安全），
      # 从写完那天起就只在本地手工跑过——等于「写了但没人盯」。
      # 这些测试全是纯函数、不依赖数据库与网络，CI 里跑没有额外成本。
      # 2026-08-05 加之前先在本地 go test ./... 确认全绿，
      # 免得把一个本来就红的检查塞进 CI、从此卡住所有 PR。
      - name: go test
        run: |
          cd server
          go test ./...

  frontend:
    name: 前端构建检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci + build
        run: |
          cd web
          npm ci
          npm run build

  # REQ-054 的一小片：WebSocket 契约回归。
  # 后端三条契约（问答广播两层结构 / room_sync 的 room 在顶层 / 踢出先送 ctrl_kick 再发 4001 关闭帧）
  # 在上面 backend 任务的 `go test ./...` 里跑（server/handlers/ws_contract_test.go、server/ws/room_kick_test.go）；
  # 这里跑前端侧对同一份共享样例（contracts/room_sync.json）的校验。
  # 用 Node 内置测试运行器 + 类型剥离，零依赖、不需要 npm ci，几秒跑完。
  contract-tests:
    name: 前端契约测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --test
        run: node --experimental-strip-types --test "web/tests/*.test.mts"


  # REQ-054 方案 C：CI 内临时环境——staging 的零成本版本（2026-09-20 用户拍板选 C，未选同机/独立机器）。
  #
  # 起一个「用完即销毁」的真 Postgres 16 + 真 Redis 7，在空库上按编号跑完全部迁移，
  # 编译并启动后端，再用一个教师 + 一个学生两条真 WebSocket 走一遍答题链路。
  # 它补的是两个此前完全空白的检查：
  #   ① 迁移文件能否从空库一路跑到最新（生产库是增量演进的，从没有人从零跑过；
  #      首次实测就发现 012_chat.sql 与 001 的约束冲突，见 scripts/ci/seed_smoke.sql）；
  #   ② 后端接真数据库 + 真 Redis 时，契约是否仍然成立
  #      （现有契约测试用的是假数据库驱动，只能证明「结构对」，证明不了「真库上跑得通」）。
  # 它不替代真机点击验收：这里没有浏览器、没有 nginx、没有 HTTPS / cookie 域。
  # 失败时会把后端日志尾部打印出来，方便直接定位。
  smoke:
    name: 后端冒烟（临时 Postgres + Redis）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mindcanvas
          POSTGRES_PASSWORD: ci-smoke-pass
          POSTGRES_DB: mindcanvas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindcanvas -d mindcanvas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # psql 与 apply_migrations.sh 读这组标准 PG 环境变量
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: mindcanvas
      PGPASSWORD: ci-smoke-pass
      PGDATABASE: mindcanvas
    steps:
      - uses: actions/checkout@v4

      - name: 确认 psql 可用
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          psql --version

      - name: 空库按编号执行全部迁移
        run: bash scripts/ci/apply_migrations.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: 编译后端
        run: |
          cd server
          go build -o "$RUNNER_TEMP/mindcanvas-server" .

      - name: 启动后端并等待 /health
        run: |
          # 后端只认环境变量即可启动（/opt/mindcanvas/configs/.env 不存在时会自动走纯环境变量模式）。
          # GIN_MODE=release 同时避免 pprof 的 :6060 被拉起。
          env \
            PORT=8080 \
            GIN_MODE=release \
            DB_HOST=127.0.0.1 DB_PORT=5432 DB_NAME=mindcanvas DB_USER=mindcanvas DB_PASSWORD=ci-smoke-pass \
            REDIS_ADDR=127.0.0.1:6379 \
            JWT_SECRET=ci-smoke-jwt-secret-not-for-production \
            PROFANITY_DICT_PATH="$GITHUB_WORKSPACE/configs/profanity_words.txt" \
            PARSER_URL=http://127.0.0.1:1 \
            nohup "$RUNNER_TEMP/mindcanvas-server" > "$RUNNER_TEMP/server.log" 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "❌ 后端 30 秒内没有起来"
            exit 1
          fi
          echo "✅ 后端已就绪"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 冒烟：教师 + 学生 WebSocket 答题链路
        run: node scripts/ci/smoke_ws.mjs

      - name: 失败时打印后端日志（尾部 200 行）
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log" || true
